global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8899"]
    metrics_path: /metrics
    scrape_interval: 15s

remote_write:
  - url: "http://prometheus:9090/api/v1/write"
