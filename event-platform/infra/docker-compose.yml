name: event-platform

networks:
  backbone: {}

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.10}
    restart: unless-stopped
    labels:
      - "traefik.project=event-platform"
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/dynamic:/etc/traefik/dynamic:ro"
      - "./traefik/acme:/etc/traefik/acme"
      - "./traefik/certs:/etc/traefik/certs:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "${TRAEFIK_HTTP_PORT:-27488}:80"
      - "${TRAEFIK_HTTPS_PORT:-27443}:443"
      - "8899:8899"
    environment:
      TRAEFIK_ACME_EMAIL: "${TRAEFIK_ACME_EMAIL}"
      TRAEFIK_LOG_LEVEL: "${TRAEFIK_LOG_LEVEL:-INFO}"
      DOMAIN_SUFFIX: "${DOMAIN_SUFFIX:-scaibu.localhost}"
      API_RATE_LIMIT_AVERAGE: "${API_RATE_LIMIT_AVERAGE:-2500}"
      API_RATE_LIMIT_BURST: "${API_RATE_LIMIT_BURST:-5000}"
      API_MAX_REQUEST_BODY_BYTES: "${API_MAX_REQUEST_BODY_BYTES:-10485760}"
      GRAFANA_TRAEFIK_BASICAUTH: "${GRAFANA_TRAEFIK_BASICAUTH}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backbone]
    depends_on:
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-27432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [backbone]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-27479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [backbone]

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
    ports:
      - "${KAFKA_INTERNAL_PORT:-27492}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      retries: 10
    networks: [backbone]

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${SCHEMA_REGISTRY_PORT:-27481}:8081"
    networks: [backbone]

  connect:
    build:
      context: ./kafka
      dockerfile: connect.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: ${CONNECT_GROUP_ID}
      CONNECT_CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_TOPIC}
      CONNECT_OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_TOPIC}
      CONNECT_STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_TOPIC}
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_OPTS: "-javaagent:/usr/share/java/opentelemetry-javaagent.jar -Dotel.instrumentation.jdbc.enabled=true -Dotel.db.statement.sanitize.enabled=false"
      OTEL_SERVICE_NAME: "kafka-connect"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_METRICS_EXPORTER: "none"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 5s
      retries: 10
    ports:
      - "${CONNECT_PORT:-27483}:8083"
    networks: [backbone]

  ingestion-api:
    build:
      context: ../services/ingestion-api
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:9092"
      REDIS_ADDR: "redis:6379"
      OTLP_ENDPOINT: "otel-collector:4317"
      SCHEMA_ID: "1"
      EVENT_TYPES_PATH: "/etc/config/event-types.yaml"
    volumes:
      - "../config/event-types.yaml:/etc/config/event-types.yaml:ro"
    deploy:
      replicas: ${INGESTION_API_REPLICAS:-1}
      resources:
        limits:
          cpus: "${INGESTION_API_CPU_LIMIT:-4.0}"
          memory: "${INGESTION_API_MEM_LIMIT:-1G}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.project=event-platform"
      - "traefik.enable=true"
      - "traefik.docker.network=event-platform_backbone"
      - "traefik.http.routers.api-http.rule=Host(`api.${DOMAIN_SUFFIX:-scaibu.localhost}`)"
      - "traefik.http.routers.api-http.entryPoints=web"
      - "traefik.http.routers.api-http.service=ingestion-api-svc"
      - "traefik.http.routers.api-http.middlewares=real-ip@file,api-ratelimit@file,api-body-limit@file,security-headers@file"
      - "traefik.http.routers.api-https.rule=Host(`api.${DOMAIN_SUFFIX:-scaibu.localhost}`)"
      - "traefik.http.routers.api-https.entryPoints=websecure"
      - "traefik.http.routers.api-https.service=ingestion-api-svc"
      - "traefik.http.routers.api-https.tls=true"
      - "traefik.http.routers.api-https.tls.options=secure@file"
      - "traefik.http.routers.api-https.middlewares=real-ip@file,api-ratelimit@file,api-body-limit@file,api-retry@file,api-circuit-breaker@file,security-headers@file"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.server.port=8080"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.server.scheme=http"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.healthCheck.path=/healthz"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.healthCheck.interval=10s"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.healthCheck.timeout=5s"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.responseForwarding.flushInterval=100ms"
      - "traefik.http.services.ingestion-api-svc.loadbalancer.passHostHeader=true"
    networks: [backbone]

  stream-processor:
    build:
      context: ../services/stream-processor
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar -Dotel.instrumentation.jdbc.enabled=true -Dotel.db.statement.sanitize.enabled=false"
      OTEL_SERVICE_NAME: "stream-processor"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_METRICS_EXPORTER: "none"
    networks: [backbone]

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - "./tempo/tempo.yaml:/etc/tempo.yaml:ro"
    networks: [backbone]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - "./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro"
    ports:
      - "${OTEL_GRPC_PORT:-27417}:4317"
      - "${OTEL_HTTP_PORT:-27418}:4318"
    depends_on: [tempo]
    networks: [backbone]

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports:
      - "${PROMETHEUS_PORT:-27490}:9090"
    networks: [backbone]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-27402}:3000"
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-Scaibu@123}"
      GF_SERVER_ROOT_URL: "http://grafana.${DOMAIN_SUFFIX:-scaibu.localhost}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    depends_on: [prometheus, tempo]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.project=event-platform"
      - "traefik.enable=true"
      - "traefik.docker.network=event-platform_backbone"
      - "traefik.http.routers.grafana-http.rule=Host(`grafana.${DOMAIN_SUFFIX:-scaibu.localhost}`)"
      - "traefik.http.routers.grafana-http.entryPoints=web"
      - "traefik.http.routers.grafana-http.service=grafana-svc"
      - "traefik.http.routers.grafana-http.middlewares=real-ip@file,grafana-security-headers@file"
      - "traefik.http.routers.grafana-https.rule=Host(`grafana.${DOMAIN_SUFFIX:-scaibu.localhost}`)"
      - "traefik.http.routers.grafana-https.entryPoints=websecure"
      - "traefik.http.routers.grafana-https.service=grafana-svc"
      - "traefik.http.routers.grafana-https.tls=true"
      - "traefik.http.routers.grafana-https.tls.options=secure@file"
      - "traefik.http.routers.grafana-https.middlewares=real-ip@file,grafana-security-headers@file"
      - "traefik.http.services.grafana-svc.loadbalancer.server.port=${GRAFANA_CONTAINER_PORT:-3000}"
      - "traefik.http.services.grafana-svc.loadbalancer.server.scheme=http"
      - "traefik.http.services.grafana-svc.loadbalancer.healthCheck.path=/api/health"
      - "traefik.http.services.grafana-svc.loadbalancer.healthCheck.interval=15s"
      - "traefik.http.services.grafana-svc.loadbalancer.healthCheck.timeout=5s"
      - "traefik.http.services.grafana-svc.loadbalancer.passHostHeader=true"
    networks: [backbone]
