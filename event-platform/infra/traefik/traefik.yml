global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: "30s"
        writeTimeout: "30s"
        idleTimeout: "90s"
      lifeCycle:
        requestAcceptGraceTimeout: "5s"
        graceTimeOut: "30s"

  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "30s"
        writeTimeout: "30s"
        idleTimeout: "90s"
      lifeCycle:
        requestAcceptGraceTimeout: "5s"
        graceTimeOut: "30s"

  metrics:
    address: ":8899"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: event-platform_backbone
    exposedByDefault: false
    watch: true
    constraints: "Label(`traefik.project`, `event-platform`)"
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: metrics

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

tracing:
  otlp:
    grpc:
      endpoint: "otel-collector:4317"
      insecure: true

accessLog:
  format: json

log:
  level: "INFO"
  format: json
