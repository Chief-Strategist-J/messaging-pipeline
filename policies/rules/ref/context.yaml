feature:
  name: "auth"
  purpose: "Enterprise Identity & Access Management (IAM) vertical slice owning authentication, user registration, credential verification, OpenTelemetry distributed tracing, and JWT session security."
  criticality: "CRITICAL"

tla_formal_verification_results:
  tool: "TLC Model Checker v2026.07.18"
  specification_file: "src/features/auth/tla/AuthFlow.tla"
  config_file: "src/features/auth/tla/AuthFlow.cfg"
  verification_status: "PASSED (0 Invariant Violations across 1.67M+ States Verified)"
  states_generated: 1672252
  distinct_states_found: 799933
  state_graph_search_depth: 29
  fifteen_formal_domains_modeled:
    1_credential_handling: "Username existence, wrong password, policy failures, temp/permanent account lockout."
    2_authentication_flow: "Client validation, request submission, backend verification, session creation & destruction."
    3_access_token: "Generation, uniqueness, TTL expiration ticks, revocation sets, user/session binding."
    4_refresh_token: "Pair rotation, old token revocation, refresh replay detection & automatic security isolation."
    5_authorization: "Roles (admin/manager/user), permissions sets, privilege escalation guards."
