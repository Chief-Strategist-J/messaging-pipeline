ascii_architecture_tree: |
  +---------------------------------------------------------------------------------------------------+
  |                                   AUTH FEATURE VERTICAL SLICE                                     |
  +---------------------------------------------------------------------------------------------------+
  |                                                                                                   |
  |  [React UI Layer]                                                                                 |
  |     ├── LoginForm.tsx ------------+                                                               |
  |     ├── SignupForm.tsx -----------|                                                               |
  |     ├── ForgotPasswordForm.tsx ---+                                                               |
  |     └── DashboardView.tsx         |                                                               |
  |                                   v                                                               |
  |  [Modular Validation Layer] (DRY Principle)                                                      |
  |     ├── validation/types.ts -------> Models & Interfaces (ValidationResult, ValidationRule)       |
  |     ├── validation/rules.ts -------> Declarative Schema Configurations (LOGIN_SCHEMA)            |
  |     └── validation/engine.ts ------> Schema Execution Engine & AuthValidator                      |
  |                                   |                                                               |
  |  [Custom Hooks Layer]             v                                                               |
  |     ├── useAuthManagement() (src/features/auth/hooks/use-auth-management.ts)                     |
  |     └── useApiKeyService() (src/features/auth/hooks/use-api-key-service.ts)                      |
  |                                   |                                                               |
  |                                   | Dispatches Redux Action                                       |
  |                                   v                                                               |
  |  [State Management Layer]                                                                         |
  |     ├── authSlice.ts <------------+ (src/features/auth/store/auth-slice.ts)                        |
  |     │     (reducers: loginRequest, loginSuccess, loginFailure, signupRequest, logout)            |
  |     │                                                                                             |
  |     └── authSaga.ts -------------> Intercepts takeLatest(loginRequest / signupRequest)            |
  |           (src/features/auth/store/auth-saga.ts)                                                 |
  |                                   |                                                               |
  |                                   | Invokes Service Function                                      |
  |                                   v                                                               |
  |  [API & Core Services Layer]                                                                      |
  |     ├── ApiKeyService -------------> Constructor DI Overridable Service                           |
  |     └── auth-api.ts -------------> loginApi() / signupApi() / forgotPasswordApi()                 |
  |           (src/features/auth/services/auth-api.ts)                                               |
  |                                   |                                                               |
  |                                   | HTTP Request via Centralized Telemetry Client                 |
  |                                   v                                                               |
  |  [Shared Infrastructure & OpenTelemetry Layer]                                                    |
  |     ├── TelemetryService (src/lib/telemetry.ts) -- W3C Distributed Context Generator               |
  |     ├── HttpClient (src/lib/http-client.ts) ----- Attaches traceparent & Bearer Token              |
  |     └── API_ENDPOINTS (src/lib/api-endpoints.ts)                                                  |
  |                                   |                                                               |
  |                                   v (HTTP POST / GET)                                             |
  |  [Spring Boot REST Backend]                                                                       |
  |     ├── /api/v1/auth/login                                                                        |
  |     ├── /api/v1/auth/signup                                                                       |
  |     ├── /api/v1/auth/forgot-password                                                              |
  |     ├── /api/v1/auth/reset-password                                                               |
  |     └── /api/v1/auth/verify-email                                                                 |
  |                                                                                                   |
  +---------------------------------------------------------------------------------------------------+

ascii_logical_flow: |
  +---------------------------------------------------------------------------------------------------+
  |                                   AUTHENTICATION EXECUTION FLOW                                   |
  +---------------------------------------------------------------------------------------------------+
  |                                                                                                   |
  |   (1) User Input                                                                                  |
  |        [LoginForm] --(validate via AuthValidator)--> [useAuthManagement]                          |
  |                                                         |                                         |
  |   (2) Redux Dispatch                                    v                                         |
  |        [store.dispatch(authActions.loginRequest(credentials))]                                    |
  |                                                         |                                         |
  |   (3) Redux Saga Interception                           v                                         |
  |        [handleLoginSaga] --(call)--> [loginApi(credentials)]                                      |
  |                                                 |                                                 |
  |   (4) Network Transmission & Distributed Tracing    v                                         |
  |        [TelemetryService.createSpan()] --> Attach traceparent                                     |
  |        [HttpClient.post('/api/v1/auth/login')] ----> [Spring Boot REST API]                        |
  |                                                         |                                         |
  |   (5) Response Resolution                               v                                         |
  |        [ApiSingleResponse<T>] <-------------------------+                                         |
  |                 |                                                                                 |
  |        +--------+--------+                                                                        |
  |        |                 |                                                                        |
  |     [SUCCESS]         [FAILURE]                                                                   |
  |        |                 |                                                                        |
  |        v                 v                                                                        |
  |  Set Bearer Token  Put loginFailure                                                               |
  |        |           (authActions)                                                                  |
  |        v                 |                                                                        |
  |  Put loginSuccess        v                                                                        |
  |  (authActions)    Update state.error                                                              |
  |        |                 |                                                                        |
  |        +--------+--------+                                                                        |
  |                 |                                                                                 |
  |                 v                                                                                 |
  |   (6) UI Render Update                                                                            |
  |        [LoginForm & App Header UI Update]                                                         |
  |                                                                                                   |
  +---------------------------------------------------------------------------------------------------+

